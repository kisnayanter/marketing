<style>
  [data-reveal] {
    opacity: 0;
    transform: translateY(22px);
    transition: opacity .6s cubic-bezier(.2,.9,.25,1), transform .65s cubic-bezier(.2,.9,.25,1);
  }
  [data-reveal].in { opacity: 1; transform: none; }
</style>
<script>
(function(){
  setTimeout(function(){
    var sections = document.querySelectorAll('section');
    sections.forEach(function(s){ s.setAttribute('data-reveal',''); });
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); }
      });
    },{ threshold: 0.07, rootMargin: '0px 0px -30px 0px' });
    sections.forEach(function(s){ io.observe(s); });

    // Fallback: iOS Safari (and Chrome on iPhone, which uses the Safari engine)
    // can miss IntersectionObserver callbacks for elements already intersecting
    // the viewport on first paint, leaving sections stuck at opacity:0. Force
    // visibility after 1.5s so animations never fail open.
    setTimeout(function(){ sections.forEach(function(s){ s.classList.add("in"); }); }, 1500);
  }, 200);
})();
</script>

<style>

  @media (max-width: 768px) {
    .mob-menu-btn { display: flex !important; align-items: center; justify-content: center; width: 40px; height: 40px; border: 1px solid var(--ky-cream-line); border-radius: 10px; background: var(--ky-cream-deep); cursor: pointer; }

    .mob-nav-open.is-open { display: flex; }

</style>

<script>
(function(){
  // Inject mobile hamburger button into nav
  setTimeout(function(){
    var nav = document.querySelector('nav');
    if (!nav) return;

    // Create hamburger button
    var btn = document.createElement('button');
    btn.className = 'mob-menu-btn';
    btn.innerHTML = '<svg width="20" height="20" viewBox="0 0 20 20"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
    btn.style.display = 'none'; // CSS shows it on mobile
    nav.appendChild(btn);

    // Create mobile nav panel
    var panel = document.createElement('div');
    panel.className = 'mob-nav-open';
    var pages = [
      ['index.html','Home'],['farmer.html','Farmers'],['owner.html','Owners'],
      ['operator.html','Operators'],['pricing.html','Pricing'],
      ['about.html','About'],['contact.html','Contact']
    ];
    pages.forEach(function(p){
      var a = document.createElement('a');
      a.href = p[0]; a.textContent = p[1];
      panel.appendChild(a);
    });
    document.body.appendChild(panel);

    var open = false;
    var openSvg = '<svg width="20" height="20" viewBox="0 0 20 20"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
    var closeSvg = '<svg width="20" height="20" viewBox="0 0 20 20"><path d="M4 4l12 12M16 4L4 16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
    function setOpen(next) {
      open = next;
      panel.classList.toggle('is-open', open);
      document.body.classList.toggle('menu-open', open);
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      btn.innerHTML = open ? closeSvg : openSvg;
    }
    btn.setAttribute('aria-label', 'Open menu');
    btn.setAttribute('aria-expanded', 'false');
    btn.addEventListener('click', function() { setOpen(!open); });
    panel.addEventListener('click', function(e) {
      if (e.target.tagName === 'A') setOpen(false);
    });
  }, 400);
})();
</script>
