function OperatorFAQ() {

    { q:"How and when do I get paid?", a:"Each completed job is logged with duration and pay rate. All jobs for the week are totalled and transferred to your UPI every Friday." },
    { q:"Can I work for multiple owners?", a:"Yes. You can be linked to multiple owners. Each owner can see your availability but not your other employers. You manage your schedule from a single dashboard." },

  return (
    <section style={{ padding:"100px 64px", background:"var(--ky-cream-deep)", borderTop:"1px solid var(--ky-cream-line)" }}>
      <div style={{ maxWidth:900, margin:"0 auto" }}>

        <div style={{ border:"1px solid var(--ky-cream-line)", borderRadius:"var(--r-card)", overflow:"hidden", background:"var(--ky-cream)" }}>

            <div key={i} style={{ borderTop: i===0 ? "none" : "1px solid var(--ky-cream-line)" }}>
              <button onClick={() => setOpen(open===i ? -1 : i)} style={{ width:"100%", display:"flex", justifyContent:"space-between", alignItems:"center", padding:"22px 28px", background:"transparent", border:"none", textAlign:"left", gap:20, cursor:"pointer" }}>
                <span style={{ fontFamily:"var(--f-display)", fontSize:19, fontWeight:600, color:"var(--ky-ink)" }}>{f.q}</span>
                <span style={{ width:30, height:30, borderRadius:999, background: open===i ? "var(--ky-op-blue)" : "var(--ky-cream-deep)", color: open===i ? "var(--ky-cream)" : "var(--ky-ink-2)", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0, transition:"transform .25s", transform: open===i ? "rotate(45deg)" : "rotate(0)" }}>

              </div>

  );
}

function OperatorCTA() {
  return (

<style>
  [data-reveal] {
    opacity: 0;
    transform: translateY(22px);
    transition: opacity .6s cubic-bezier(.2,.9,.25,1), transform .65s cubic-bezier(.2,.9,.25,1);
  }
  [data-reveal].in { opacity: 1; transform: none; }
</style>
<script>
(function(){
  setTimeout(function(){
    var sections = document.querySelectorAll('section');
    sections.forEach(function(s){ s.setAttribute('data-reveal',''); });
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); }
      });
    },{ threshold: 0.07, rootMargin: '0px 0px -30px 0px' });
    sections.forEach(function(s){ io.observe(s); });
  }, 200);
})();
</script>

<!-- Mobile nav: hamburger menu -->
<style>
  .mob-menu-btn { display: none; }
  .mob-nav-open { display: none; }
  body.menu-open { overflow: hidden; }
  @media (max-width: 768px) {
    .mob-menu-btn { display: flex !important; align-items: center; justify-content: center; width: 40px; height: 40px; border: 1px solid var(--ky-cream-line); border-radius: 10px; background: var(--ky-cream-deep); cursor: pointer; }

    .mob-nav-open a { padding: 14px 16px; border-radius: 10px; font-size: 17px; font-weight: 600; text-decoration: none; color: var(--ky-ink-2); border-bottom: 1px solid var(--ky-cream-line); }
  }

<script>
(function(){
  // Inject mobile hamburger button into nav
  setTimeout(function(){
    var nav = document.querySelector('nav');
    if (!nav) return;

    // Create hamburger button
    var btn = document.createElement('button');
    btn.className = 'mob-menu-btn';
    btn.innerHTML = '<svg width="20" height="20" viewBox="0 0 20 20"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
    btn.style.display = 'none'; // CSS shows it on mobile
    nav.appendChild(btn);

    // Create mobile nav panel
    var panel = document.createElement('div');
    panel.className = 'mob-nav-open';
    var pages = [
      ['index.html','Home'],['farmer.html','🌾 Farmers'],['owner.html','🚜 Owners'],
      ['operator.html','👨‍🌾 Operators'],['pricing.html','Pricing'],
      ['about.html','About'],['contact.html','Contact']
    ];
    pages.forEach(function(p){
      var a = document.createElement('a');
      a.href = p[0]; a.textContent = p[1];
      panel.appendChild(a);
    });
    document.body.appendChild(panel);

    var open = false;
    var openSvg = '<svg width="20" height="20" viewBox="0 0 20 20"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
    var closeSvg = '<svg width="20" height="20" viewBox="0 0 20 20"><path d="M4 4l12 12M16 4L4 16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
    function setOpen(next) {
      open = next;
      panel.classList.toggle('is-open', open);
      document.body.classList.toggle('menu-open', open);
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      btn.innerHTML = open ? closeSvg : openSvg;
    }
    btn.setAttribute('aria-label', 'Open menu');
    btn.setAttribute('aria-expanded', 'false');
    btn.addEventListener('click', function() { setOpen(!open); });
    panel.addEventListener('click', function(e) {
      if (e.target.tagName === 'A') setOpen(false);
    });
  }, 400);
})();
</script>

<style>
  .hero-stage-3d { perspective: 1200px; perspective-origin: 50% 40%; }
  .hero-phone-3d { transition: transform .12s ease-out; will-change: transform; transform-style: preserve-3d; }
  .hero-card-3d  { transition: transform .16s ease-out; will-change: transform; }
  @keyframes autoFloat { 
    0%   { transform: rotateY(-4deg) rotateX(2deg); }
    25%  { transform: rotateY(4deg) rotateX(-1deg); }
    50%  { transform: rotateY(2deg) rotateX(3deg); }
    75%  { transform: rotateY(-3deg) rotateX(-2deg); }
    100% { transform: rotateY(-4deg) rotateX(2deg); }
  }
  @media (max-width: 768px) {
    .hero-stage-3d { perspective: none; }
    .hero-phone-3d { animation: autoFloat 6s ease-in-out infinite; }
    .hero-card-3d  { transform: none !important; }
  }
</style>
<script>
(function(){
  setTimeout(function(){
    var stages = document.querySelectorAll('.hero-stage-3d');
    stages.forEach(function(stage){
      var phone = stage.querySelector('.hero-phone-3d');
      var cards = stage.querySelectorAll('.hero-card-3d');
      var tx=0, ty=0, cx=0, cy=0, raf;
      var isMobile = window.innerWidth <= 768;

      if (!isMobile) {
        // Desktop: mouse parallax
        function onMove(e){
          var r = stage.getBoundingClientRect();
          tx = ((e.clientX-r.left-r.width/2)/(r.width/2))*16;
          ty = ((e.clientY-r.top-r.height/2)/(r.height/2))*-10;
        }
        function onLeave(){ tx=0; ty=0; }
        function tick(){
          cx += (tx-cx)*0.09; cy += (ty-cy)*0.09;
          if(phone) phone.style.transform = 'rotateY('+cx+'deg) rotateX('+cy+'deg)';
          cards.forEach(function(c,i){
            var d = (i%2===0)?1.4:0.7;
            c.style.transform = 'translateX('+(cx*d*1.8)+'px) translateY('+(cy*d*1.4)+'px)';
          });
          raf = requestAnimationFrame(tick);
        }
        stage.addEventListener('mousemove', onMove);
        stage.addEventListener('mouseleave', onLeave);
        raf = requestAnimationFrame(tick);

      } else {
        // Mobile: device orientation gyroscope tilt
        var hasGyro = false;
        if (window.DeviceOrientationEvent) {
          window.addEventListener('deviceorientation', function(e){
            if (e.gamma === null) return;
            hasGyro = true;
            // gamma = left-right tilt (-90 to 90), beta = front-back (-180 to 180)
            tx = Math.max(-12, Math.min(12, e.gamma * 0.4));
            ty = Math.max(-8,  Math.min(8,  (e.beta - 30) * 0.2));
          }, { passive: true });
        }
        // Auto-float CSS animation handles it when no gyro (via CSS above)
        // If gyro available, override the CSS animation
        function tick(){
          if (hasGyro && phone) {
            cx += (tx-cx)*0.06; cy += (ty-cy)*0.06;
            phone.style.animation = 'none';
            phone.style.transform = 'rotateY('+cx+'deg) rotateX('+cy+'deg)';
          }
          raf = requestAnimationFrame(tick);
        }
        raf = requestAnimationFrame(tick);
      }
    });
  }, 300);
})();
</script>
