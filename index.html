<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ── Scroll reveal hook ──────────────────────────────────────
function useReveal() {
  useEffect(() => {
    const els = document.querySelectorAll('.reveal');
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) { e.target.classList.add('visible'); io.unobserve(e.target); }
      });
    }, { threshold: 0.12 });
    els.forEach(el => io.observe(el));
    return () => io.disconnect();
  }, []);
}

// ── Reveal wrapper component ────────────────────────────────
function Reveal({ children, delay = 0, style = {} }) {
  return (
    <div className={"reveal" + (delay ? " reveal-delay-" + delay : "")} style={style}>
      {children}
    </div>
  );
}

function Hero3D() {
  const { useRef, useEffect, useState } = React;
  const stageRef = useRef(null);
  const phoneRef = useRef(null);
  const [screens] = useState(["screens/operator-home.png","screens/farmer-track.png","screens/owner-home.png"]);
  const [screenIdx, setScreenIdx] = useState(0);

  // Cycle screens
  useEffect(() => {
    const t = setInterval(() => setScreenIdx(i => (i+1) % screens.length), 2400);
    return () => clearInterval(t);
  }, []);

  // Mouse parallax
  useEffect(() => {
    const stage = stageRef.current;
    if (!stage) return;
    let raf;
    let tx = 0, ty = 0, cx = 0, cy = 0;

    function onMove(e) {
      const r = stage.getBoundingClientRect();
      const mx = (e.clientX - r.left - r.width/2) / (r.width/2);
      const my = (e.clientY - r.top - r.height/2) / (r.height/2);
      tx = mx * 18; ty = my * -12;
    }
    function onLeave() { tx = 0; ty = 0; }
    function tick() {
      cx += (tx - cx) * 0.08;
      cy += (ty - cy) * 0.08;
      if (phoneRef.current) {
        phoneRef.current.style.transform = `rotateY(${cx}deg) rotateX(${cy}deg)`;
      }
      // layers move at different depths
      const layers = stage.querySelectorAll('[data-depth]');
      layers.forEach(l => {
        const d = parseFloat(l.getAttribute('data-depth') || 1);
        l.style.transform = `translateX(${cx * d * 2}px) translateY(${cy * d * 1.5}px)`;
      });
      raf = requestAnimationFrame(tick);
    }
    stage.addEventListener('mousemove', onMove);
    stage.addEventListener('mouseleave', onLeave);
    raf = requestAnimationFrame(tick);
    return () => { stage.removeEventListener('mousemove', onMove); stage.removeEventListener('mouseleave', onLeave); cancelAnimationFrame(raf); };
  }, []);

  const isMobile = useIsBelow(768);

  // On mobile, equipment images are smaller and pinned inside the stage
  // (no negative offsets) so they don't overflow the viewport.
  const equip = isMobile ? [
    { img:"equipment/tractor.png",   top:24,    right:6,   w:54, anim:"floatEq1 4.2s ease-in-out infinite",      depth:"0.6" },
    { img:"equipment/harvester.png", top:140,   left:6,    w:50, anim:"floatEq2 3.8s ease-in-out infinite .4s",  depth:"1.1" },
    { img:"equipment/sprayer.png",   bottom:90, right:6,   w:48, anim:"floatEq3 4.8s ease-in-out infinite .8s",  depth:"0.8" },
    { img:"equipment/rotavator.png", bottom:18, left:6,    w:56, anim:"floatEq2 5.2s ease-in-out infinite 1.2s", depth:"1.4" },
  ] : [
    { img:"equipment/tractor.png",   top:60,  right:20,  w:110, anim:"floatEq1 4.2s ease-in-out infinite",      depth:"0.6" },
    { img:"equipment/harvester.png", top:180, left:-40,  w:90,  anim:"floatEq2 3.8s ease-in-out infinite .4s",  depth:"1.1" },
    { img:"equipment/sprayer.png",   bottom:120, right:-30, w:80, anim:"floatEq3 4.8s ease-in-out infinite .8s", depth:"0.8" },
    { img:"equipment/rotavator.png", bottom:60, left:20,  w:95,  anim:"floatEq2 5.2s ease-in-out infinite 1.2s", depth:"1.4" },
  ];

  const phoneWidth = isMobile ? 220 : 300;
  const haloSize   = isMobile ? 280 : 460;
  const ring1Size  = isMobile ? 290 : 480;
  const ring2Size  = isMobile ? 230 : 380;

  return (
    <section style={{ padding:"80px 64px 100px", background:"var(--ky-cream)", position:"relative", overflow:"hidden" }}>
      {/* Topo rings background */}
      <svg style={{ position:"absolute", inset:0, width:"100%", height:"100%", opacity:.09, pointerEvents:"none" }} viewBox="0 0 1440 800" preserveAspectRatio="xMidYMid slice">
        {Array.from({length:14}).map((_,i) => <ellipse key={i} cx="1180" cy="180" rx={80+i*80} ry={50+i*52} stroke="#FF6B00" strokeWidth=".7" fill="none" opacity={.5-i*.03}/>)}
        {Array.from({length:8}).map((_,i) => <ellipse key={"g"+i} cx="200" cy="700" rx={60+i*60} ry={40+i*40} stroke="#1A7A3B" strokeWidth=".7" fill="none" opacity={.4-i*.04}/>)}
      </svg>

      <div style={{ maxWidth:1312, margin:"0 auto", display:"grid", gridTemplateColumns:"1fr 1fr", gap:60, alignItems:"center", position:"relative" }}>
        {/* Copy */}
        <div>
          <span style={{ display:"inline-flex", alignItems:"center", gap:8, padding:"6px 14px", borderRadius:999, background:"var(--ky-saffron-tint)", color:"var(--ky-saffron-deep)", fontSize:13, fontWeight:700, marginBottom:24 }}>
            <span style={{ width:7, height:7, borderRadius:999, background:"var(--ky-saffron)" }}/>
            Farm equipment marketplace · भारत के लिए
          </span>
          <CyclingTagline size={80}/>
          <p style={{ fontSize:19, color:"var(--ky-ink-2)", lineHeight:1.6, marginTop:24, maxWidth:520 }}>
            Farmers rent the tractor they need by the hour. Owners earn from machines that used to sit idle. Operators get steady, paid work. All in your language.
          </p>
          <div style={{ display:"flex", gap:12, marginTop:36, flexWrap:"wrap" }}>
            <StoreBadge store="play"/>
            <StoreBadge store="apple"/>
          </div>
          <div style={{ display:"flex", gap:22, marginTop:28, fontSize:14, color:"var(--ky-ink-3)", flexWrap:"wrap" }}>
            <span style={{ display:"inline-flex", alignItems:"center", gap:7 }}><Icon name="globe" size={15} color="var(--ky-saffron)"/>10 languages</span>
            <span style={{ display:"inline-flex", alignItems:"center", gap:7 }}><Icon name="sealCheck" size={15} color="var(--ky-forest)" weight="fill"/>Verified owners</span>
            <span style={{ display:"inline-flex", alignItems:"center", gap:7 }}><Icon name="wallet" size={15} color="var(--ky-op-blue)"/>UPI &amp; cash</span>
          </div>
        </div>

        {/* 3D Stage */}
        <div ref={stageRef} className="hero3d-stage" style={{ position:"relative", minHeight: isMobile ? 460 : 640, display:"flex", alignItems:"center", justifyContent:"center", cursor: isMobile ? "default" : "none" }}>
          {/* Glow halo */}
          <div style={{ position:"absolute", width:haloSize, height:haloSize, borderRadius:999, background:"radial-gradient(circle, rgba(255,107,0,0.22) 0%, rgba(26,122,59,0.08) 50%, transparent 75%)", filter:"blur(30px)", pointerEvents:"none" }}/>

          {/* Spinning ring */}
          <div style={{ position:"absolute", width:ring1Size, height:ring1Size, borderRadius:999, border:"1px dashed rgba(255,107,0,0.2)", animation:"spinHalo 22s linear infinite", pointerEvents:"none" }}/>
          <div style={{ position:"absolute", width:ring2Size, height:ring2Size, borderRadius:999, border:"1px dashed rgba(26,122,59,0.15)", animation:"spinHalo 16s linear infinite reverse", pointerEvents:"none" }}/>

          {/* Phone */}
          <div ref={phoneRef} className="hero3d-phone" style={{ position:"relative", zIndex:3 }}>
            <ScreenshotPhone src={screens[screenIdx]} width={phoneWidth}/>
          </div>

          {/* Floating equipment images */}
          {equip.map((e,i) => (
            <div key={i} data-depth={e.depth} className="hero3d-equip" style={{
              position:"absolute",
              top: e.top, bottom: e.bottom, right: e.right, left: e.left,
              zIndex: 4, pointerEvents:"none",
              animation: e.anim,
            }}>
              <img src={e.img} alt="" style={{ width:e.w, height:e.w, objectFit:"contain", filter:"drop-shadow(0 12px 24px rgba(30,26,18,0.22))" }}/>
            </div>
          ))}

          {/* Floating UI cards — hidden on mobile (text doesn't shrink gracefully) */}
          <div data-depth="0.5" className="hero3d-textcard" style={{ position:"absolute", top:40, left:-20, padding:"12px 16px", background:"var(--ky-cream)", borderRadius:14, border:"1px solid var(--ky-cream-line)", boxShadow:"0 16px 36px rgba(30,26,18,0.10)", zIndex:5, animation:"floatCard 4s ease-in-out infinite" }}>
            <div style={{ display:"flex", alignItems:"center", gap:10 }}>
              <div style={{ width:36, height:36, borderRadius:999, background:"var(--ky-forest-soft)", display:"flex", alignItems:"center", justifyContent:"center" }}>
                <Icon name="sealCheck" size={20} color="var(--ky-forest)" weight="fill"/>
              </div>
              <div>
                <div style={{ fontFamily:"var(--f-display)", fontWeight:700, fontSize:14 }}>Booking confirmed!</div>
                <div style={{ fontSize:11, color:"var(--ky-ink-3)" }}>Mahindra 575 · ₹1,500/day</div>
              </div>
            </div>
          </div>

          <div data-depth="1.2" className="hero3d-textcard" style={{ position:"absolute", bottom:150, right:-30, padding:"12px 16px", background:"var(--ky-cream)", borderRadius:14, border:"1px solid var(--ky-cream-line)", boxShadow:"0 16px 36px rgba(30,26,18,0.10)", zIndex:5, animation:"floatCard 5s ease-in-out infinite .8s" }}>
            <div style={{ fontSize:11, color:"var(--ky-ink-4)", fontWeight:700, textTransform:"uppercase", letterSpacing:"0.08em" }}>This month · owner</div>
            <div style={{ fontFamily:"var(--f-display)", fontWeight:800, fontSize:26, color:"var(--ky-forest)", letterSpacing:"-0.02em", lineHeight:1 }}>₹42,500</div>
            <div style={{ fontSize:12, color:"var(--ky-forest-deep)", fontWeight:600, marginTop:2 }}>↑ 18% vs last month</div>
          </div>

          <div data-depth="0.7" className="hero3d-textcard" style={{ position:"absolute", top:300, right:-50, padding:"10px 14px", background:"var(--ky-cream)", borderRadius:999, border:"1px solid var(--ky-cream-line)", boxShadow:"0 10px 24px rgba(30,26,18,0.08)", zIndex:5, display:"flex", alignItems:"center", gap:8, animation:"floatCard 3.6s ease-in-out infinite 1.4s" }}>
            <Icon name="mapPin" size={16} color="var(--ky-saffron)" weight="fill"/>
            <span style={{ fontFamily:"var(--f-display)", fontWeight:700, fontSize:13 }}>1.8 km · on the way</span>
          </div>
        </div>
      </div>
    </section>
  );
}
window.Hero3D = Hero3D;

function App() {
  const [role, setRole] = useState("farmer");
  const [lang, setLang] = useState("hi");
  useReveal();

  return (
    <div style={{ fontFamily:"var(--f-body)", color:"var(--ky-ink)", background:"var(--ky-cream)" }}>

      {/* Hero — animated */}

      {/* Launch countdown banner */}

        <span style={{ display:"inline-flex", alignItems:"center", gap:6 }}>
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="6" stroke="currentColor" strokeWidth="1.5"/><path d="M7 4v3.5l2 2" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/></svg>

      {/* FAQ */}

    </div>
  );
}

</script>

<script>
(function(){
  // Inject mobile hamburger button into nav
  setTimeout(function(){
    var nav = document.querySelector('nav');
    if (!nav) return;

    // Create hamburger button
    var btn = document.createElement('button');
    btn.className = 'mob-menu-btn';
    btn.innerHTML = '<svg width="20" height="20" viewBox="0 0 20 20"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
    btn.style.display = 'none'; // CSS shows it on mobile
    nav.appendChild(btn);

    // Create mobile nav panel
    var panel = document.createElement('div');
    panel.className = 'mob-nav-open';
    var pages = [
      ['index.html','Home'],['farmer.html','🌾 Farmers'],['owner.html','🚜 Owners'],
      ['operator.html','👨‍🌾 Operators'],['pricing.html','Pricing'],
      ['about.html','About'],['contact.html','Contact']
    ];
    pages.forEach(function(p){
      var a = document.createElement('a');
      a.href = p[0]; a.textContent = p[1];
      panel.appendChild(a);
    });
