<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Kisan Sadhan Equipment Catalog — 30+ farm equipment types</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="tokens.css"/>
  <style>
    body { background: var(--ky-cream); }
    .eq-card { transition: transform .2s ease, box-shadow .2s ease; }
    .eq-card:hover { transform: translateY(-5px); box-shadow: 0 20px 40px rgba(30,26,18,0.1); }
    @media (max-width: 768px) {
      nav { padding: 14px 20px !important; }
      nav > div:nth-child(2) { display: none !important; }
      section { padding: 40px 16px !important; }
      .eq-grid { grid-template-columns: repeat(2,1fr) !important; }
    }
    @media (max-width: 480px) {
      /* On phones <480px (incl. iPhone 13/14 mini at 390px), 2-up cards leave
         no room for the equipment image + description. Drop to single column. */
      .eq-grid { grid-template-columns: 1fr !important; }
    }
  </style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel">
const { useState } = React;

const EQUIPMENT = [
  { name:"Tractor",         hi:"ट्रैक्टर",       cat:"Tillage",     img:"uploads/tractor.png",         from:"₹700/day",   desc:"15–75 HP tractors for ploughing, sowing, transport and all general farm tasks." },
  { name:"Power Tiller",    hi:"पावर टिलर",       cat:"Tillage",     img:"uploads/power_tiller.png",    from:"₹450/day",   desc:"Compact tillers for small plots, paddy fields and hilly terrain." },
  { name:"Rotavator",       hi:"रोटावेटर",         cat:"Tillage",     img:"uploads/rotavator.png",       from:"₹600/day",   desc:"Pulverises soil for seedbed preparation. Works with 35 HP+ tractors." },
  { name:"Cultivator",      hi:"कल्टीवेटर",        cat:"Tillage",     img:"uploads/cultivator.png",      from:"₹500/day",   desc:"Inter-row cultivation, weed control and secondary tillage." },
  { name:"Plough",          hi:"हल",               cat:"Tillage",     img:"uploads/plough.png",          from:"₹400/day",   desc:"Disc and MB ploughs for deep primary tillage before sowing." },
  { name:"Harrow",          hi:"हैरो",             cat:"Tillage",     img:"uploads/harrow.png",          from:"₹380/day",   desc:"Breaks clods, levels soil and incorporates crop residues." },
  { name:"Seed Drill",      hi:"सीड ड्रिल",        cat:"Sowing",      img:"uploads/seed_drill.png",      from:"₹550/day",   desc:"Precise seed placement at uniform depth for wheat, maize and pulses." },
  { name:"Planter",         hi:"प्लांटर",           cat:"Sowing",      img:"uploads/planter.png",         from:"₹600/day",   desc:"Transplants seedlings for cotton, maize and sunflower." },
  { name:"Transplanter",    hi:"ट्रांसप्लांटर",    cat:"Sowing",      img:"uploads/transplanter.png",    from:"₹700/day",   desc:"Paddy transplanting machine — 8 rows per pass. Saves 80% labour cost." },
  { name:"Harvester",       hi:"हार्वेस्टर",         cat:"Harvesting",  img:"uploads/harvester.png",       from:"₹2,400/day", desc:"Combine harvesters for wheat, paddy, soybean and mustard." },
  { name:"Maize Harvester", hi:"मक्का हार्वेस्टर",   cat:"Harvesting",  img:"uploads/maize_harvester.png", from:"₹1,800/day", desc:"Dedicated maize cob picker and sheller in a single machine." },
  { name:"Reaper",          hi:"रीपर",             cat:"Harvesting",  img:"uploads/reaper.png",          from:"₹800/day",   desc:"Cuts and windrowed wheat and paddy. Works on 35 HP+ tractors." },
  { name:"Thresher",        hi:"थ्रेशर",            cat:"Harvesting",  img:"uploads/thresher.png",        from:"₹700/day",   desc:"Separates grain from straw for wheat, paddy, maize and sorghum." },
  { name:"Winnower",        hi:"विनोअर",           cat:"Harvesting",  img:"uploads/winnower.png",        from:"₹400/day",   desc:"Cleans harvested grain by separating husk, dust and broken kernels." },
  { name:"Potato Digger",   hi:"आलू खोदक",         cat:"Harvesting",  img:"uploads/potato_digger.png",   from:"₹900/day",   desc:"Digs and separates potatoes from soil. 1–2 row models available." },
  { name:"Baler",           hi:"बेलर",             cat:"Harvesting",  img:"uploads/baler.png",           from:"₹1,200/day", desc:"Compresses crop residue into compact bales for storage or sale." },
  { name:"Sprayer",         hi:"स्प्रेयर",          cat:"Protection",  img:"uploads/sprayer.png",         from:"₹350/day",   desc:"Boom sprayers and mist blowers for pesticide and fertiliser application." },
  { name:"Duster",          hi:"डस्टर",            cat:"Protection",  img:"uploads/duster.png",          from:"₹280/day",   desc:"Dry pesticide dust applicator for fungal disease control." },
  { name:"Drone",           hi:"ड्रोन",            cat:"Protection",  img:"uploads/drone.png",           from:"₹1,500/day", desc:"Agricultural drone for precision spraying. Covers 1 acre in 10 minutes." },
  { name:"Flame Weeder",    hi:"फ्लेम वीडर",        cat:"Protection",  img:"uploads/flame_weeder.png",    from:"₹600/day",   desc:"Kills weeds with controlled heat — no herbicide residue on soil." },
  { name:"Water Pump",      hi:"वाटर पंप",          cat:"Irrigation",  img:"uploads/water_pump.png",      from:"₹350/day",   desc:"Diesel and electric pumps for field irrigation, 1–10 HP range." },
  { name:"Drip System",     hi:"ड्रिप सिस्टम",      cat:"Irrigation",  img:"uploads/drip_system.png",     from:"₹800/day",   desc:"Complete drip irrigation setup for vegetables, sugarcane and orchards." },
  { name:"Sprinkler",       hi:"स्प्रिंकलर",         cat:"Irrigation",  img:"uploads/sprinkler.png",       from:"₹600/day",   desc:"Overhead sprinkler system for even water distribution across large plots." },
  { name:"Rain Gun",        hi:"रेन गन",            cat:"Irrigation",  img:"uploads/rain_gun.png",        from:"₹700/day",   desc:"High-discharge rotating sprinkler for sugarcane and cotton fields." },
  { name:"Dryer",           hi:"ड्रायर",            cat:"Post-harvest", img:"uploads/dryer.png",           from:"₹900/day",   desc:"Grain drying unit for paddy and wheat — prevents spoilage." },
  { name:"Grader",          hi:"ग्रेडर",            cat:"Post-harvest", img:"uploads/grader.png",          from:"₹800/day",   desc:"Sorts produce by size and weight for market or export quality." },
  { name:"Trailer",         hi:"ट्रेलर",            cat:"Transport",   img:"uploads/trailer.png",         from:"₹500/day",   desc:"Tractor-attached trailer for produce, input and equipment transport." },
  { name:"Truck",           hi:"ट्रक",             cat:"Transport",   img:"uploads/truck.png",           from:"₹2,000/day", desc:"Mini trucks for farm-to-market transport of vegetables, grain and fruit." },
  { name:"Other",           hi:"अन्य",             cat:"Other",       img:"uploads/other.png",           from:"Varies",     desc:"Don't see what you need? Post a request — owners near you will send offers." },
];

const CATS = ["All", "Tillage", "Sowing", "Harvesting", "Protection", "Irrigation", "Post-harvest", "Transport"];
const CAT_COLOR = { All:"var(--ky-ink)", Tillage:"var(--ky-saffron)", Sowing:"var(--ky-forest)", Harvesting:"var(--ky-saffron)", Protection:"var(--ky-op-blue)", Irrigation:"var(--ky-op-blue)", "Post-harvest":"var(--ky-forest)", Transport:"var(--ky-ink-2)" };

function PageNav() {
  return (
    <nav style={{ position:"sticky", top:0, zIndex:50, display:"flex", alignItems:"center", justifyContent:"space-between", padding:"14px 64px", borderBottom:"1px solid var(--ky-cream-line)", background:"rgba(253,250,245,0.92)", backdropFilter:"blur(10px)", gap:24 }}>
      <a href="index.html" style={{ textDecoration:"none", flexShrink:0 }}><KYLogo size={30}/></a>
      <div style={{ display:"flex", gap:2, flex:1, justifyContent:"center" }}>
        {[["index.html","Home"],["farmer.html","Farmers"],["owner.html","Owners"],["operator.html","Operators"],["pricing.html","Pricing"],["about.html","About"],["contact.html","Contact"]].map(([href,label]) => (
          <a key={href} href={href} style={{ padding:"7px 14px", borderRadius:8, textDecoration:"none", fontWeight:500, fontSize:14, color:"var(--ky-ink-3)" }}>{label}</a>
        ))}
      </div>
      <div style={{ flexShrink:0, display:"flex", gap:8 }}><StoreBadge store="apple" compact/><StoreBadge store="play" compact/></div>
    </nav>
  );
}

function App() {
  const [cat, setCat] = useState("All");
  const [q, setQ] = useState("");
  const filtered = EQUIPMENT.filter(e =>
    (cat === "All" || e.cat === cat) &&
    (!q || e.name.toLowerCase().includes(q.toLowerCase()) || e.hi.includes(q))
  );

  return (
    <div style={{ fontFamily:"var(--f-body)", color:"var(--ky-ink)", background:"var(--ky-cream)" }}>
      <PageNav/>

      {/* Hero */}
      <section style={{ padding:"60px 64px 40px", borderBottom:"1px solid var(--ky-cream-line)" }}>
        <div style={{ maxWidth:1312, margin:"0 auto" }}>
          <span style={{ display:"inline-flex", alignItems:"center", gap:8, padding:"6px 14px", borderRadius:999, background:"var(--ky-saffron-tint)", color:"var(--ky-saffron-deep)", fontSize:13, fontWeight:700, marginBottom:18 }}>
            <Icon name="tractor" size={14} color="var(--ky-saffron)"/>
            Equipment catalog · उपकरण सूची
          </span>
          <h1 style={{ fontFamily:"var(--f-display)", fontSize:56, lineHeight:1.04, letterSpacing:"-0.025em", fontWeight:800, margin:"0 0 10px", textWrap:"balance" }}>
            Everything your farm needs.
          </h1>
          <p style={{ fontFamily:"var(--f-display)", fontSize:20, color:"var(--ky-ink-3)", fontWeight:500, marginBottom:28 }}>आपके खेत के लिए सब कुछ — एक जगह</p>

          {/* Search + filters */}
          <div style={{ display:"flex", gap:12, flexWrap:"wrap", alignItems:"center" }}>
            <div style={{ position:"relative", maxWidth:360, flexShrink:0 }}>
              <svg style={{ position:"absolute", left:14, top:"50%", transform:"translateY(-50%)" }} width="16" height="16" viewBox="0 0 16 16" fill="none">
                <circle cx="7" cy="7" r="5.5" stroke="var(--ky-ink-4)" strokeWidth="1.4"/>
                <path d="M11 11l3 3" stroke="var(--ky-ink-4)" strokeWidth="1.4" strokeLinecap="round"/>
              </svg>
              <input value={q} onChange={e => setQ(e.target.value)} placeholder="Search equipment..." style={{ width:"100%", height:46, paddingLeft:42, paddingRight:14, border:"1px solid var(--ky-cream-line)", borderRadius:10, background:"var(--ky-cream)", fontSize:14, outline:"none", fontFamily:"var(--f-body)" }}/>
            </div>
            <div style={{ display:"flex", gap:6, flexWrap:"wrap" }}>
              {CATS.map(c => (
                <button key={c} onClick={() => setCat(c)} style={{ padding:"8px 16px", borderRadius:999, border:"1px solid "+(cat===c ? CAT_COLOR[c] : "var(--ky-cream-line)"), background: cat===c ? CAT_COLOR[c] : "var(--ky-cream)", color: cat===c ? "#FFF" : "var(--ky-ink-2)", fontSize:13, fontWeight:600, cursor:"pointer" }}>{c}</button>
              ))}
            </div>
          </div>

          <div style={{ marginTop:16, fontSize:13, color:"var(--ky-ink-4)" }}>
            {filtered.length} equipment types {cat !== "All" ? `· ${cat}` : ""} {q ? `· "${q}"` : ""}
          </div>
        </div>
      </section>

      {/* Grid */}
      <section style={{ padding:"40px 64px 80px" }}>
        <div style={{ maxWidth:1312, margin:"0 auto" }}>
          {filtered.length === 0 ? (
            <div style={{ textAlign:"center", padding:"80px 20px" }}>
              <div style={{ fontFamily:"var(--f-display)", fontSize:24, fontWeight:700, color:"var(--ky-ink)", marginBottom:10 }}>Nothing found</div>
              <div style={{ fontSize:15, color:"var(--ky-ink-3)" }}>Try a different search, or <a href="contact.html" style={{ color:"var(--ky-saffron)" }}>post a request</a> — owners will respond with offers.</div>
            </div>
          ) : (
            <div className="eq-grid" style={{ display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:16 }}>
              {filtered.map((e,i) => (
                <div key={i} className="eq-card" style={{ padding:"22px 18px 18px", background:"var(--ky-cream-deep)", borderRadius:"var(--r-card)", border:"1px solid var(--ky-cream-line)", display:"flex", flexDirection:"column", gap:10 }}>
                  <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start" }}>
                    <span style={{ padding:"4px 10px", borderRadius:999, background:"var(--ky-cream)", border:"1px solid var(--ky-cream-line)", fontSize:10, fontWeight:700, color:"var(--ky-ink-3)", textTransform:"uppercase", letterSpacing:"0.06em" }}>{e.cat}</span>
                    <span style={{ fontFamily:"var(--f-display)", fontSize:13, fontWeight:700, color:"var(--ky-saffron)" }}>{e.from}</span>
                  </div>
                  <div style={{ height:96, display:"flex", alignItems:"center", justifyContent:"center", background:"radial-gradient(circle, rgba(255,107,0,0.08), transparent 65%)", borderRadius:12 }}>
                    <img src={e.img} alt={e.name} style={{ width:76, height:76, objectFit:"contain", filter:"drop-shadow(0 6px 12px rgba(30,26,18,0.15))" }} onError={ev => { ev.target.style.display="none"; }}/>
                  </div>
                  <div>
                    <div style={{ fontFamily:"var(--f-display)", fontWeight:700, fontSize:16, color:"var(--ky-ink)" }}>{e.name}</div>
                    <div style={{ fontFamily:"var(--f-display)", fontSize:13, color:"var(--ky-ink-3)", fontWeight:500 }}>{e.hi}</div>
                    <p style={{ fontSize:13, color:"var(--ky-ink-2)", lineHeight:1.55, marginTop:8, marginBottom:0 }}>{e.desc}</p>
                  </div>
                  <a href="farmer.html" style={{ display:"flex", alignItems:"center", justifyContent:"center", gap:6, height:38, borderRadius:10, background:"var(--ky-saffron)", color:"#FFF", textDecoration:"none", fontSize:13, fontWeight:700, marginTop:"auto", boxShadow:"0 4px 12px rgba(255,107,0,0.25)" }}>
                    Book this <Icon name="arrowRight" size={13} color="#FFF"/>
                  </a>
                </div>
              ))}
            </div>
          )}
        </div>
      </section>

      {/* CTA */}
      <section style={{ padding:"60px 64px", background:"var(--ky-saffron-tint)", borderTop:"1px solid var(--ky-cream-line)", textAlign:"center" }}>
        <h2 style={{ fontFamily:"var(--f-display)", fontSize:40, fontWeight:700, letterSpacing:"-0.02em", margin:"0 0 10px" }}>Don't see what you need?</h2>
        <p style={{ fontSize:17, color:"var(--ky-ink-2)", marginBottom:28 }}>Post a request — nearby owners will send offers within hours.</p>
        <div style={{ display:"flex", gap:12, justifyContent:"center", flexWrap:"wrap" }}>
          <a href="farmer.html" style={{ height:52, padding:"0 28px", background:"var(--ky-saffron)", color:"#FFF", borderRadius:"var(--r-btn)", textDecoration:"none", fontSize:16, fontWeight:700, display:"inline-flex", alignItems:"center", gap:10, boxShadow:"var(--sh-saffron)" }}>
            <Icon name="plus" size={16} color="#FFF"/>Post a request
          </a>
          <a href="contact.html" style={{ height:52, padding:"0 24px", background:"var(--ky-cream)", color:"var(--ky-ink)", border:"1px solid var(--ky-cream-line)", borderRadius:"var(--r-btn)", textDecoration:"none", fontSize:16, fontWeight:600, display:"inline-flex", alignItems:"center", gap:10 }}>
            Talk to us
          </a>
        </div>
      </section>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<footer style="padding:40px 64px; background:var(--ky-ink); color:rgba(253,250,245,0.65); font-size:13px;"><div style="max-width:1312px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:20px;"><span>© 2026 Kisan Sadhan · Made for Indian farmers 🇮🇳</span><div style="display:flex; gap:24px;"><a href="privacy.html" style="color:rgba(253,250,245,0.7); text-decoration:none;">Privacy</a><a href="terms.html" style="color:rgba(253,250,245,0.7); text-decoration:none;">Terms</a><a href="contact.html" style="color:rgba(253,250,245,0.7); text-decoration:none;">Contact</a></div></div></footer></body>
</html>
